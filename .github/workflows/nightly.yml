name: Nightly

# Long-running tests: every randomized test with 50x the iterations and 10x the input sizes, on every SIMD path.
# On Sundays it runs mutation testing instead (hours), uploading the HTML reports as artifacts.
on:
  schedule:
    - cron: '17 2 * * *'   # long tests, nightly
    - cron: '23 3 * * 0'   # mutation testing, Sundays
  workflow_dispatch:
    inputs:
      mutation:
        description: Also run mutation testing
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  long-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        simd:
          - { name: default, env: '' }
          - { name: avx2, env: 'DOTNET_EnableAVX512F=0' }
          - { name: vector128, env: 'DOTNET_EnableAVX2=0' }
          - { name: scalar, env: 'DOTNET_EnableHWIntrinsic=0' }
    name: long tests (${{ matrix.simd.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Bojalib.slnx -c Release
      - name: Test at 50x scale
        run: env BOJALIB_TEST_SCALE=50 ${{ matrix.simd.env }} dotnet test --project tests/Bojalib.Tests -c Release --no-build

  mutation:
    if: (github.event_name == 'workflow_dispatch' && inputs.mutation) || github.event.schedule == '23 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        area: ['**/Sorting/**/*.cs', '**/Collections/**/*.cs', '**/Probabilistic/**/*.cs', '**/Hashing/**/*.cs']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run Stryker.NET
        run: eng/mutation-test.sh "${{ matrix.area }}" "$PWD/StrykerOutput/report"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: StrykerOutput/report/reports/

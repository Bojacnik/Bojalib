name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from git tags.

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bojalib.slnx

      - name: Check formatting
        run: dotnet format Bojalib.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Bojalib.slnx --configuration Release --no-restore

      - name: Test (fails below 95% line / 90% branch coverage)
        run: >
          dotnet test --project tests/Bojalib.Tests --configuration Release --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-threshold 95 --coverlet-threshold-type line
          --coverlet-threshold 90 --coverlet-threshold-type branch
          --coverlet-threshold-stat Total

      - name: Pack
        run: dotnet pack src/Bojalib --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/

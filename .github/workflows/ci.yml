name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bojalib.slnx

      - name: Build
        run: dotnet build Bojalib.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Bojalib.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack Bojalib.slnx --configuration Release --no-build --output artifacts
